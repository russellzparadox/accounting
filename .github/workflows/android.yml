name: android

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics (versions in use)
        run: |
          echo "== runner =="
          uname -a
          echo "== version catalog =="
          cat gradle/libs.versions.toml
          echo "== wrapper =="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "== modules =="
          cat settings.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint, test, assemble debug
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace lint test assembleDebug 2>&1 | tee gradle-build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/lint-results*
            **/build/outputs/logs/**

      - name: Failure summary (short, read this first)
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "gradle-build.log missing; gradle step did not run"
            exit 0
          fi
          grep -E '^e: |^w: .*error|What went wrong|FAILURE' -A4 gradle-build.log | head -80 || true
          echo "== failed unit tests =="
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  print(f"unparseable: {f}: {e}")
                  continue
              for tc in root.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      n += 1
                      if n > 30:
                          break
                      msg = fl.get('message') or ''
                      print(f"FAILED {tc.get('classname')}.{tc.get('name')}")
                      print(f"  {str(msg)[:300]}")
          print(f"total failed testcases: {n}")
          PY
