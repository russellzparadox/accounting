name: instrumented

# Emulator QA (T13a). Never on push, so it cannot block or cancel the `android` build/release workflow.
on:
  workflow_dispatch:
  schedule:
    # Nightly, default branch only (GitHub runs scheduled workflows from the default branch).
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The emulator script runs as one line so the exit status survives: a failed Gradle run is still followed by
      # the adb pull, and the step fails at the end with the Gradle status.
      - name: Run instrumented tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: "status=0; ./gradlew --stacktrace :app:connectedDebugAndroidTest || status=$?; mkdir -p qa-artifacts; adb pull /sdcard/Android/data/com.example.accounting/files/qa qa-artifacts/ || echo 'adb pull of qa folder failed'; exit $status"

      - name: Check that QA screenshots and PDF pages were pulled
        if: always()
        run: |
          count=$(find qa-artifacts -name '*.png' 2>/dev/null | wc -l)
          echo "png files: $count"
          find qa-artifacts -type f 2>/dev/null | sort
          test "$count" -gt 0

      - name: Upload QA artifacts (screenshots, PDF pages, PDF, CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
