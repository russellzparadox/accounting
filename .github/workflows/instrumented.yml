name: instrumented

# Emulator QA (T13a). Never on push, so it cannot block or cancel the `android` build/release workflow.
on:
  workflow_dispatch:
  schedule:
    # Nightly, default branch only (GitHub runs scheduled workflows from the default branch).
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The emulator script runs as one line so the exit status survives: a failed Gradle run is still followed by
      # the adb pull, and the step fails at the end with the Gradle status.
      - name: Run instrumented tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: "status=0; mkdir -p qa-artifacts; ./gradlew --stacktrace -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest > qa-artifacts/gradle-instrumented.log 2>&1 || status=$?; tail -n 60 qa-artifacts/gradle-instrumented.log; adb logcat -d -v threadtime > qa-artifacts/logcat-full.txt 2>&1 || echo 'adb logcat failed'; grep -E 'com[.]example[.]accounting|AndroidRuntime|TestRunner|androidx[.]test|Room|Hilt|FATAL' qa-artifacts/logcat-full.txt > qa-artifacts/logcat.txt || true; bash .github/scripts/pull-qa.sh || echo 'pull-qa.sh failed'; exit $status"

      # Gate: green only when every expected QA file was pulled from files/qa (10 screenshots, PDF, PDF page PNGs, CSV).
      - name: Check that QA screenshots, PDF, PDF pages and CSV were pulled
        if: always()
        run: |
          qa=qa-artifacts/qa
          shots=$(ls "$qa" 2>/dev/null | grep -cE '^(0[1-9]|10)-.+\.png$' || true)
          pages=$(ls "$qa" 2>/dev/null | grep -cE '^trial-balance-page-[0-9]+\.png$' || true)
          echo "screenshots: ${shots:-0}/10, pdf pages: ${pages:-0}"
          find qa-artifacts -type f 2>/dev/null | sort
          missing=0
          [ "${shots:-0}" -ge 10 ] || { echo "::error title=qa-artifacts::screenshots ${shots:-0}/10 pulled"; missing=1; }
          [ "${pages:-0}" -ge 1 ] || { echo "::error title=qa-artifacts::no trial-balance-page PNG pulled"; missing=1; }
          [ -s "$qa/trial-balance.pdf" ] || { echo "::error title=qa-artifacts::trial-balance.pdf missing"; missing=1; }
          [ -s "$qa/trial-balance.csv" ] || { echo "::error title=qa-artifacts::trial-balance.csv missing"; missing=1; }
          exit $missing

      - name: Upload QA artifacts (screenshots, PDF pages, PDF, CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      # Last step on purpose. Each failure is also emitted as a ::error annotation, readable with the public
      # check-run annotations API (the job log tail is often just post-job cleanup, so do not rely on it alone).
      - name: Failure summary (short, read this first)
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, re, subprocess, xml.etree.ElementTree as ET
          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print("== gradle failure lines ==")
          try:
              lines = open('qa-artifacts/gradle-instrumented.log', encoding='utf-8', errors='replace').read().splitlines()
          except OSError:
              lines = []
          for i, line in enumerate(lines):
              if re.match(r'^e: |FAILED|What went wrong|Execution failed|There were failing tests', line.strip()):
                  print(line[:400])
                  print(f"::error title=gradle::{esc(line.strip()[:800])}")
          print("== failed androidTest cases ==")
          n = 0
          for f in sorted(glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  print(f"unparseable: {f}: {e}")
                  continue
              for tc in root.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      n += 1
                      name = f"{tc.get('classname')}.{tc.get('name')}"
                      msg = (fl.get('message') or '').strip()
                      stack = '\n'.join((fl.text or '').splitlines()[:6])
                      text = f"FAILED {name}: {msg}\n{stack}"
                      print(text[:1200])
                      print(f"::error title=androidTest FAILED {tc.get('name')}::{esc(text[:3000])}")
          print(f"total failed testcases: {n}")
          print("androidTest result files: " + str(len(glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True))))
          PY
          echo "== qa-artifacts =="
          find qa-artifacts -type f 2>/dev/null | sort | head -20 || true
